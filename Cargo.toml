[package]
name = "neat"
version = "0.1.0"
edition = "2024"

[dependencies]
glam = "0.30.8"
macroquad = "0.4.14"
rand = "0.9.2"
rand_distr = "0.5.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
